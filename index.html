<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>消费架构工作台</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2b25">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="消费架构">
<style>
:root{
  --bg:#f4f5f2; --card:#ffffff; --ink:#1b2420; --mut:#6f7b74; --line:#e4e8e2;
  --acc:#2f9e6e; --acc-soft:#e8f5ee; --warn:#d98324; --warn-soft:#fdf1e2;
  --dan:#cf4b45; --dan-soft:#fbeceb; --blue:#3d7bd9; --blue-soft:#eaf1fc;
  --rad:16px; --shadow:0 1px 2px rgba(20,30,25,.05),0 8px 24px -12px rgba(20,30,25,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 72px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{font-size:19px;font-weight:700;letter-spacing:.3px}
.brand span{font-weight:400;color:var(--mut);font-size:13px;margin-left:6px}
.btn{
  border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px;
  padding:8px 12px; font-size:13px; cursor:pointer; font-family:inherit; line-height:1;
}
.btn:hover{border-color:#cfd6ce}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.primary:hover{background:#2a8f63}
.btn.ghost{background:transparent}
.btn.danger{color:var(--dan);border-color:#eed4d2}
.btn.sm{padding:6px 9px;font-size:12px}
.periodbar{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.periodbar .nav{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;line-height:1;color:var(--mut)}
.periodbar .lbl{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;background:#e9ece7;border-radius:13px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex:1 0 auto; border:0;background:transparent;padding:9px 12px;border-radius:10px;
  font:inherit;font-size:13.5px;color:var(--mut);cursor:pointer;white-space:nowrap;
}
.tabs button.on{background:#fff;color:var(--ink);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.view{display:none;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--mut);letter-spacing:.4px}
.hero{background:linear-gradient(160deg,#1f2b25,#2c3a31);color:#eef3ef;border:0}
.hero .lab{font-size:12.5px;color:#9fb3a7;letter-spacing:.5px}
.hero .big{font-size:38px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:2px 0 2px}
.hero .big.neg{color:#f0a19b}
.hero .sub{font-size:12.5px;color:#a8bcb0}
.hero .chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero .chip{background:rgba(255,255,255,.09);border-radius:9px;padding:7px 10px;font-size:12px;color:#dbe8e0;min-width:88px}
.hero .chip b{display:block;font-size:15px;color:#fff;font-variant-numeric:tabular-nums;margin-top:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.pool{display:flex;flex-direction:column;gap:7px}
.pool .row1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pool .nm{font-weight:650;font-size:14px}
.pool .nm i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:7px;vertical-align:1px}
.pool .amt{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.pool .amt b{color:var(--ink)}
.bar{height:7px;border-radius:99px;background:#ecefe9;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.pool .foot{font-size:11.5px;color:var(--mut)}
.over{color:var(--dan)!important}
.rows{display:flex;flex-direction:column;gap:2px}
.tr{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #f0f2ee}
.tr:last-child{border-bottom:0}
.tr .t{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;min-width:44px}
.tr .d{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.tr .p{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--acc-soft);color:#2b7d5a;white-space:nowrap}
.tr .m{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;min-width:70px;text-align:right}
.tr .x{border:0;background:transparent;color:#c2c9c3;cursor:pointer;font-size:15px;padding:0 2px}
.tr .x:hover{color:var(--dan)}
.empty{padding:18px 4px;color:var(--mut);font-size:13px;text-align:center}
.hint{font-size:12.5px;color:var(--mut);line-height:1.6}
.note{background:var(--warn-soft);border:1px solid #f5dfc3;color:#8a5a18;border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.6}
.note.ok{background:var(--acc-soft);border-color:#cfe9dc;color:#25704f}
.amountRow{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.amountRow .cur{font-size:24px;color:var(--mut);font-weight:600}
.amountRow input{
  flex:1;border:0;outline:0;background:transparent;font:600 34px/1.2 inherit;color:var(--ink);
  font-variant-numeric:tabular-nums;padding:2px 0;min-width:0;
}
.amountRow input::placeholder{color:#d3d8d2}
.label{font-size:12px;color:var(--mut);margin:14px 0 8px;letter-spacing:.3px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip-btn{
  border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:inherit;
  font-size:13px;color:var(--ink);cursor:pointer;
}
.chip-btn.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chip-btn.s{font-size:12.5px;padding:6px 10px;border-radius:9px}
.chip-btn.emerg{border-style:dashed;border-color:#d3c9ee;color:#6f5aa8}
.chip-btn.emerg.on{background:#7d6bb5;border-color:#7d6bb5;color:#fff;border-style:solid}
input.txt,select.txt{
  width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 12px;font:inherit;font-size:15px;
  background:#fff;color:var(--ink);outline:0;min-height:46px;
}
textarea.txt{
  width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit;font-size:14px;
  background:#fff;color:var(--ink);outline:0;min-height:76px;resize:vertical;line-height:1.55;
}
input.txt:focus,select.txt:focus,textarea.txt:focus{border-color:#b9c8bd}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.split{display:flex;gap:8px;align-items:center}
.split > *{min-width:0}
.drop{
  border:1.5px dashed #c8d2c9;border-radius:14px;padding:26px 16px;text-align:center;color:var(--mut);
  background:#fafbf9;cursor:pointer;transition:.15s;font-size:13.5px;
}
.drop:hover,.drop.hot{border-color:var(--acc);background:var(--acc-soft);color:#2b7d5a}
.drop b{color:var(--ink)}
.drop small{display:block;margin-top:6px;font-size:11.5px;color:#98a49b}
table.prev{width:100%;border-collapse:collapse;font-size:12.5px}
table.prev th{text-align:left;color:var(--mut);font-weight:500;padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
table.prev td{padding:6px 5px;border-bottom:1px solid #f2f4f0;vertical-align:middle}
table.prev td select{padding:5px 6px;font-size:12px;border-radius:7px;border:1px solid var(--line);background:#fff;max-width:100%}
table.prev .dup{opacity:.45}
.right{margin-left:auto}
.mut{color:var(--mut)}
.mono{font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #eef0ec;font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums;text-align:right;max-width:64%}

/* 三餐柱状图 */
.chart{display:flex;gap:6px;height:132px;margin-top:10px}
.chart .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart .v{font-size:10.5px;color:var(--mut);font-variant-numeric:tabular-nums;height:14px;line-height:14px}
.chart .barwrap{flex:1;width:100%;display:flex;align-items:flex-end}
.chart .barwrap i{display:block;width:100%;background:#2f9e6e;border-radius:6px 6px 3px 3px;min-height:2px}
.chart .barwrap i.today{background:#1f2b25}
.chart .d{font-size:11px;color:var(--mut)}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#22302a;color:#fff;
  padding:10px 16px;border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:99;
  max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.okText{color:#2f9e6e !important}
.errText{color:#cf4b45 !important}
.pill{display:inline-block;background:#f0f3ef;color:#3c463f;border-radius:9px;padding:6px 11px;font-size:12.5px;margin:0 6px 6px 0;font-variant-numeric:tabular-nums}

/* 新手引导 */
.tour{position:fixed;inset:0;z-index:120;display:none}
.tour.on{display:block}
.tourBlock{position:absolute;inset:0}
.tourSpot{
  position:absolute;border-radius:16px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(12,18,15,.58);
  border:2px solid rgba(255,255,255,.7);
  transition:top .22s ease,left .22s ease,width .22s ease,height .22s ease;
}
.tourCard{
  position:absolute;background:#fff;border-radius:16px;padding:16px 16px 14px;
  box-shadow:0 16px 48px rgba(0,0,0,.3);width:min(330px, calc(100vw - 32px));
  transition:top .18s ease,left .18s ease;
}
.tourStep{font-size:11px;color:var(--mut);letter-spacing:.6px}
.tourTitle{font-size:16.5px;font-weight:700;margin:4px 0 6px;line-height:1.35}
.tourText{font-size:13px;line-height:1.7;color:#3c463f}
.tourBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.tourBtns .btn{padding:9px 14px}
.settings-row{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;margin-bottom:9px}
.settings-row .t{font-size:13.5px}
.settings-row .t small{display:block;color:var(--mut);font-size:11.5px;line-height:1.4}
.rule{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f1f3ef;font-size:13px}
.rule .kw{font-weight:600}
.rule .tag{font-size:11px;background:#f0f2ee;border-radius:6px;padding:2px 6px;color:var(--mut)}
.wish{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f3ef}
.wish .in{flex:1;min-width:0}
.wish .in b{font-size:13.5px}
.wish .in small{display:block;color:var(--mut);font-size:11.5px}
.wish .act{display:flex;gap:6px}
.wish .tm{font-size:11px;color:var(--warn);font-variant-numeric:tabular-nums;white-space:nowrap}
.fixRow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f3ef}
.fixRow:last-of-type{border-bottom:0}
.fixRow .in{flex:1;min-width:0}
.fixRow .in b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fixRow .in small{display:block;color:var(--mut);font-size:11.5px;margin-top:1px}
.fixRow .btn{flex:0 0 auto;white-space:nowrap}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--mut);cursor:pointer;line-height:1.4}
.chk input{width:16px;height:16px;flex:0 0 auto;accent-color:#2f9e6e}
.section-title{font-size:12px;letter-spacing:.6px;color:var(--mut);margin:22px 0 9px;font-weight:600}
.foot-note{text-align:center;color:#a5afa7;font-size:11.5px;margin-top:26px;line-height:1.8}

/* 分配饼图 */
.alloc{display:flex;gap:16px;align-items:center;margin:2px 0 14px}
.pie{
  position:relative;width:126px;height:126px;border-radius:50%;flex:0 0 auto;
  background:#ecefe9;transition:background .25s ease;
}
.pieHole{
  position:absolute;inset:25px;background:#fff;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 0 0 1px rgba(20,30,25,.04);
}
.pieHole b{font-size:19px;font-variant-numeric:tabular-nums;line-height:1.1}
.pieHole small{font-size:10.5px;color:var(--mut);margin-top:2px}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.legend .lg{display:flex;align-items:center;gap:7px;font-size:12px;line-height:1.5}
.legend .lg i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.legend .lg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.legend .lg b{font-variant-numeric:tabular-nums;font-weight:600}
.legend .lg em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
@media(max-width:400px){.pie{width:108px;height:108px}.pieHole{inset:22px}}

/* 明细行可点 */
.tr.tap{cursor:pointer;border-radius:8px}
.tr.tap:hover{background:#f7f9f6}
.tr.tap:active{background:#f1f4ef}

/* 编辑弹层 */
.sheetWrap{
  position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;
  background:rgba(18,26,22,.42);backdrop-filter:blur(2px);
}
.sheetWrap.on{display:flex}
.sheet{
  background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;
  box-shadow:0 -10px 44px rgba(10,20,15,.22);animation:sheetUp .2s ease;
}
@keyframes sheetUp{from{transform:translateY(26px);opacity:.55}to{transform:none;opacity:1}}
.sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheetHead b{font-size:15.5px}
.sheetHead .x{border:0;background:#f1f3ef;width:28px;height:28px;border-radius:9px;font-size:16px;color:#6f7b74;cursor:pointer;line-height:1}
.sheet .amountRow input{font-size:28px}
.sheetActions{display:flex;gap:8px;margin-top:18px}
.sheetActions .btn{flex:1;padding:13px}
.sheetFoot{margin-top:10px;text-align:center}
@media(min-width:620px){.sheetWrap{align-items:center;padding:24px}.sheet{border-radius:20px;animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero-top">
    <div class="brand">消费架构<span>工作台</span></div>
    <div style="display:flex;gap:6px">
      <button class="btn sm ghost" data-act="backup">备份</button>
      <button class="btn sm ghost" data-act="goSettings">设置</button>
    </div>
  </div>

  <div class="periodbar">
    <button class="nav" data-act="prevPeriod">‹</button>
    <div class="lbl" id="periodLabel">—</div>
    <button class="nav" data-act="nextPeriod">›</button>
    <div class="right"></div>
    <button class="btn sm ghost" data-act="todayPeriod">回到本月</button>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="dash" class="on">看板</button>
    <button data-tab="entry">记一笔</button>
    <button data-tab="import">导账单</button>
    <button data-tab="list">明细</button>
    <button data-tab="settings">设置</button>
  </div>

  <main>
    <section id="v-dash" class="view on"></section>
    <section id="v-entry" class="view"></section>
    <section id="v-import" class="view"></section>
    <section id="v-list" class="view"></section>
    <section id="v-settings" class="view"></section>
  </main>

  <div class="foot-note">数据只保存在这台设备的浏览器里 · 记得定期「备份」导出 JSON</div>
</div>
<div class="sheetWrap" id="sheet"></div>
<div class="tour" id="tour">
  <div class="tourBlock" id="tourBlock"></div>
  <div class="tourSpot" id="tourSpot" style="display:none"></div>
  <div class="tourCard" id="tourCard"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================ 基础常量 ============================ */

var LS_KEY = "spend_arch_v1";

var POOLS = [
  { id:"fixed",  name:"固定盘", color:"#7b8b9a", hex:"#7b8b9a", tip:"房租水电话费订阅，到账先扣" },
  { id:"living", name:"生存盘", color:"#2f9e6e", hex:"#2f9e6e", tip:"吃饭日用交通医疗，按周发" },
  { id:"growth", name:"成长盘", color:"#3d7bd9", hex:"#3d7bd9", tip:"书/课程/设备/Token，可以结转" },
  { id:"flex",   name:"弹性盘", color:"#d98324", hex:"#d98324", tip:"娱乐社交网购，封顶+冷静期" }
];
var POOL_MAP = {};
POOLS.forEach(function(p){ POOL_MAP[p.id] = p; });

/* 应急/代付：照样记，但不计入生活费（不占池、不进储蓄率） */
var OUTSIDE = { id:"outside", name:"应急", hex:"#7d6bb5", tip:"爸妈补 / 报销，不计入生活费" };
POOL_MAP.outside = OUTSIDE;
var ALL_POOLS = POOLS.concat([OUTSIDE]);

var SUBS = {
  fixed:  ["房租水电","通讯","订阅","学费","其他"],
  living: ["吃饭","零食","日用","交通","医疗","洗护","其他"],
  growth: ["书","课程","设备","文具","Token","其他"],
  flex:   ["娱乐","社交","网购","奶茶咖啡","其他"],
  outside:["医疗","牙科","药品","其他"]
};

function defaultSettings(){
  return {
    income: 2000,
    startDay: 1,
    pct: { fixed:10, living:50, growth:10, flex:15 },
    saveRate: 15,
    coolThreshold: 100,
    coolDays: 2
  };
}
function blankState(){
  return { version:1, settings:defaultSettings(), tx:[], wish:[], rules:[], fixes:[], subs:[], meta:{ createdAt: Date.now() } };
}

/* ============================ 状态读写 ============================ */

var state = loadState();
var curPeriod = null;          // 当前查看的周期起点（Date）
var activeTab = "dash";
var entryPool = "living", entrySub = "吃饭";
var importRows = [];           // 待确认导入
var listFilter = "all";

function loadState(){
  var s = blankState();
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw){
      var o = JSON.parse(raw);
      if (o && typeof o === "object"){
        s.settings = Object.assign(defaultSettings(), o.settings || {});
        s.settings.pct = Object.assign(defaultSettings().pct, (o.settings && o.settings.pct) || {});
        s.tx = Array.isArray(o.tx) ? o.tx : [];
        s.wish = Array.isArray(o.wish) ? o.wish : [];
        s.rules = Array.isArray(o.rules) ? o.rules : [];
        s.fixes = Array.isArray(o.fixes) ? o.fixes : [];
        s.subs = Array.isArray(o.subs) ? o.subs : [];
        s.meta = o.meta || s.meta;
      }
    }
  } catch(e){ /* 存储损坏则用初始状态，导出功能仍可救数据 */ }
  return s;
}
function saveState(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast("保存失败：浏览器存储空间不足或被禁用"); }
}

/* ============================ 小工具 ============================ */

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function pad2(n){ return n < 10 ? "0" + n : "" + n; }
function money(n, dec){
  if (dec === undefined) dec = 2;
  var neg = n < 0;
  var v = Math.abs(n).toFixed(dec);
  return (neg ? "-¥" : "¥") + v;
}
function money0(n){ return money(Math.round(n), 0); }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function num(v, def){ var n = parseFloat(v); return isFinite(n) ? n : (def || 0); }

var toastTimer = null;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("on"); }, 2200);
}

/* ---------- 日期 ---------- */

function daysInMonth(y, m){ return new Date(y, m + 1, 0).getDate(); }

function parseTs(s){
  var mm = /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})(?:[ T](\d{1,2}):(\d{1,2}))?/.exec(String(s || "").trim());
  if (!mm) return null;
  return new Date(+mm[1], +mm[2] - 1, +mm[3], +(mm[4] || 0), +(mm[5] || 0));
}
function tsString(d){
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) +
         " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function dateLabel(d){ return (d.getMonth() + 1) + "月" + d.getDate() + "日"; }
function sameDay(a, b){
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function periodStartOf(date, startDay){
  var sd = Math.min(startDay, daysInMonth(date.getFullYear(), date.getMonth()));
  if (date.getDate() >= sd) return new Date(date.getFullYear(), date.getMonth(), sd);
  var py = date.getMonth() === 0 ? date.getFullYear() - 1 : date.getFullYear();
  var pm = date.getMonth() === 0 ? 11 : date.getMonth() - 1;
  var psd = Math.min(startDay, daysInMonth(py, pm));
  return new Date(py, pm, psd);
}
function periodEndOf(start, startDay){
  var ny = start.getMonth() === 11 ? start.getFullYear() + 1 : start.getFullYear();
  var nm = start.getMonth() === 11 ? 0 : start.getMonth() + 1;
  var sd = Math.min(startDay, daysInMonth(ny, nm));
  return new Date(ny, nm, sd);
}
function periodRange(start, startDay){
  var s = startOfDay(start);
  var e = periodEndOf(s, startDay);
  var label;
  if (startDay === 1) label = s.getFullYear() + " 年 " + (s.getMonth() + 1) + " 月";
  else {
    var last = new Date(e.getTime() - 86400000);
    label = (s.getMonth() + 1) + "/" + s.getDate() + " – " + (last.getMonth() + 1) + "/" + last.getDate();
  }
  return { start:s, end:e, days: Math.round((e - s) / 86400000), label:label };
}

/* ============================ 统计 ============================ */

function budgetOf(poolId){
  return num(state.settings.income) * num(state.settings.pct[poolId]) / 100;
}
function saveTarget(){ return num(state.settings.income) * num(state.settings.saveRate) / 100; }

/* 可花基数 = 生活费 − 储蓄目标。储蓄那份从到账起就不算「能花的钱」。 */
function spendableBase(){
  return Math.max(0, num(state.settings.income) - saveTarget());
}

function monthIndex(d){ return d.getFullYear() * 12 + d.getMonth(); }

/* 订阅清单一共多少（年付按 12 个月、季付按 3 个月摊成月均） */
function subMonthlyOne(s){
  var a = num(s.amount);
  if (s.cycle === "year") return a / 12;
  if (s.cycle === "quarter") return a / 3;
  return a;
}
function subYearlyOne(s){
  var a = num(s.amount);
  if (s.cycle === "year") return a;
  if (s.cycle === "quarter") return a * 4;
  return a * 12;
}
function subCycleLabel(s){
  return s.cycle === "year" ? " / 年" : (s.cycle === "quarter" ? " / 季" : " / 月");
}
function subsMonthly(){
  var s = 0;
  state.subs.forEach(function(x){ s += subMonthlyOne(x); });
  return s;
}
function subsYearly(){
  var s = 0;
  state.subs.forEach(function(x){ s += subYearlyOne(x); });
  return s;
}

/* 分摊标签：12 期叫年付、3 期叫季付 */
function spreadWord(sp){
  if (sp === 12) return "年付";
  if (sp === 3) return "季付";
  return "预付";
}

function periodStats(){
  var r = periodRange(curPeriod, num(state.settings.startDay, 1));
  var txs = [], byPool = {}, bySub = {}, byOutSub = {};
  POOLS.forEach(function(p){ byPool[p.id] = 0; });
  var total = 0, cash = 0, outside = 0, outsideCount = 0;
  var pmi = monthIndex(r.start);

  for (var i = 0; i < state.tx.length; i++){
    var t = state.tx[i];
    var d = parseTs(t.ts);
    if (!d) continue;
    var inPeriod = d >= r.start && d < r.end;
    var a = num(t.amount);
    var sp = num(t.spread);

    if (t.pool === "outside"){
      if (inPeriod){
        outside += a; outsideCount++; cash += a;
        byOutSub[t.sub] = (byOutSub[t.sub] || 0) + a;
        txs.push(t);
      }
      continue;
    }

    if (sp > 1){
      /* 年付：现金在付款月一次性出去，消费按 12 个月摊到每个覆盖月 */
      if (inPeriod){ cash += a; txs.push(t); }
      var tmi = monthIndex(d);
      if (pmi >= tmi && pmi < tmi + sp){
        var c = a / sp;
        total += c;
        byPool[t.pool] = (byPool[t.pool] || 0) + c;
        bySub[t.pool + "|" + t.sub] = (bySub[t.pool + "|" + t.sub] || 0) + c;
      }
      continue;
    }

    if (inPeriod){
      cash += a;
      total += a;
      byPool[t.pool] = (byPool[t.pool] || 0) + a;
      bySub[t.pool + "|" + t.sub] = (bySub[t.pool + "|" + t.sub] || 0) + a;
      txs.push(t);
    }
  }

  txs.sort(function(a, b){ return parseTs(b.ts) - parseTs(a.ts); });
  return { range:r, txs:txs, byPool:byPool, bySub:bySub, byOutSub:byOutSub,
           total:total, cash:cash, outside:outside, outsideCount:outsideCount };
}

function weekRange(now){
  // 以周一为一周起点
  var d = startOfDay(now);
  var wd = (d.getDay() + 6) % 7;
  var s = new Date(d.getFullYear(), d.getMonth(), d.getDate() - wd);
  var e = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 7);
  return { start:s, end:e };
}

function sumBetween(txs, from, to){
  var s = 0;
  txs.forEach(function(t){
    var d = parseTs(t.ts);
    if (d && d >= from && d < to) s += num(t.amount);
  });
  return s;
}

function classify(text){
  var t = String(text || "").toLowerCase().replace(/\s+/g, "");
  if (!t) return { pool:"flex", sub:"其他", why:"empty" };
  for (var i = 0; i < state.rules.length; i++){
    var r = state.rules[i];
    if (r && r.kw && t.indexOf(String(r.kw).toLowerCase()) >= 0){
      return { pool:r.pool, sub:r.sub, why:"rule" };
    }
  }
  for (var j = 0; j < KEYWORDS.length; j++){
    if (t.indexOf(KEYWORDS[j][0]) >= 0){
      return { pool:KEYWORDS[j][1], sub:KEYWORDS[j][2], why:"kw" };
    }
  }
  return { pool:"flex", sub:"其他", why:"none" };
}

function txHash(ts, amount, party){

}

/* ============================ 改错排行 ============================ */

/* 归一化：去掉括号、空格、标点，商户名的同一家店才认得出来 */
function normKw(s){
  return String(s || "").replace(/[【】\[\]（）()\s·,，.。:：、\-—_/]/g, "").slice(0, 30);
}

function findFix(kw){
  for (var i = 0; i < state.fixes.length; i++){
    if (state.fixes[i].kw === kw) return state.fixes[i];
  }
  return null;
}

function lcpLen(a, b){
  var n = Math.min(a.length, b.length), i = 0;
  while (i < n && a.charAt(i) === b.charAt(i)) i++;
  return i;
}

/* 每改一次分类，就给这个词条记一笔账。
   分店/楼层这类后缀会造成同一家店多个写法，用公共前缀把它们并成一个词条。 */
function recordFix(text, pool, sub){
  var kw = normKw(text);
  if (!kw || kw.length < 2) return;
  var rec = null;
  for (var i = 0; i < state.fixes.length; i++){
    var f = state.fixes[i];
    if (f.kw === kw){ rec = f; break; }
    var L = lcpLen(f.kw, kw);
    var shorter = Math.min(f.kw.length, kw.length);
    if (L >= 6 && L >= Math.ceil(shorter * 0.6)){ rec = f; break; }
  }
  if (!rec){
    rec = { kw:kw, label:String(text).slice(0, 40), pool:pool, sub:sub, count:0, lastAt:0 };
    state.fixes.push(rec);
  } else {
    var L2 = lcpLen(rec.kw, kw);
    if (L2 >= 6 && L2 < Math.min(rec.kw.length, kw.length)){
      rec.kw = kw.slice(0, L2);
    } else if (kw.length < rec.kw.length){
      rec.kw = kw;
    }
  }
  rec.count += 1;
  rec.pool = pool;
  rec.sub = sub;
  rec.lastAt = Date.now();
  rec.label = String(text).slice(0, 40);
}

function pendingFixes(){
  return state.fixes.filter(function(f){ return f.count >= 2; })
    .sort(function(a, b){ return b.count - a.count || b.lastAt - a.lastAt; });
}

function addRuleSilent(kw, pool, sub){
  var dup = state.rules.some(function(r){ return r.kw === kw; });
  if (dup) return;
  state.rules.unshift({ id: uid(), kw: kw, pool: pool, sub: sub });
}

function applyFix(kw){
  var rec = findFix(kw);
  if (!rec) return false;
  var changed = 0;
  state.tx.forEach(function(t){
    var text = normKw(t.party || t.note || "");
    if (text.indexOf(rec.kw) >= 0 && (t.pool !== rec.pool || t.sub !== rec.sub)){
      t.pool = rec.pool;
      t.sub = rec.sub;
      changed++;
    }
  });
  addRuleSilent(rec.kw, rec.pool, rec.sub);
  state.fixes = state.fixes.filter(function(f){ return f.kw !== rec.kw; });
  saveState();
  var p = POOL_MAP[rec.pool] || { name:rec.pool };
  toast("改了 " + changed + " 笔，以后「" + rec.label + "」自动归到 " + p.name);
  return true;
}

function applyAllFixes(){
  var list = pendingFixes();
  if (!list.length) return;
  var total = 0;
  list.forEach(function(f){
    var n = 0;
    state.tx.forEach(function(t){
      var text = normKw(t.party || t.note || "");
      if (text.indexOf(f.kw) >= 0 && (t.pool !== f.pool || t.sub !== f.sub)){ t.pool = f.pool; t.sub = f.sub; n++; }
    });
    addRuleSilent(f.kw, f.pool, f.sub);
    total += n;
  });
  state.fixes = [];
  saveState();
  toast("全部套用完成，共改 " + total + " 笔");
}

/* ============================ 看板 ============================ */

/* 每日额度模型：
   第 1 周没有历史，按平均值（池剩余 ÷ 剩余天数）；
   第 2 周起，用「上周实际日均」做预期并给出月末预测。 */
function dailyPlan(){
  var st = periodStats();
  var spendable = spendableBase();
  var today = startOfDay(new Date());
  var daysLeft = Math.max(1, Math.round((st.range.end - today) / 86400000));

  var pLeft = {};
  POOLS.forEach(function(p){ pLeft[p.id] = budgetOf(p.id) - (st.byPool[p.id] || 0); });

  var d7 = 7 * 86400000;
  var w1s = new Date(today.getTime() - d7);
  var w2s = new Date(today.getTime() - 2 * d7);
  var w1 = 0, w1Living = 0, w1Flex = 0, w2 = 0;

  /* 最后一条记录在哪天——用来估算「已经花掉但还没导入」的钱 */
  var lastDay = null;

  for (var i = 0; i < state.tx.length; i++){
    var t = state.tx[i];
    var d = parseTs(t.ts);
    if (!d) continue;
    if (t.pool !== "outside"){
      if (!lastDay || d > lastDay) lastDay = d;
    }
    if (t.pool === "outside") continue;
    var a = num(t.amount);
    var sp = num(t.spread);
    var v = sp > 1 ? a / sp : a;
    if (d >= w1s && d < today){
      w1 += v;
      if (t.pool === "living") w1Living += v;
      if (t.pool === "flex") w1Flex += v;
    } else if (d >= w2s && d < w1s){
      w2 += v;
    }
  }

  var lastDaily = w1 / 7;
  var prevDaily = w2 / 7;
  var hasHistory = w1 > 0;

  /* 滞后天数：今天 − 最后一条记录（最多算 7 天，再多就是根本没在记） */
  var lagDays = 0;
  if (lastDay){
    lagDays = Math.round((today - startOfDay(lastDay)) / 86400000);
    if (lagDays < 0) lagDays = 0;
    if (lagDays > 7) lagDays = 7;
  }

  /* 未入账估算：按上周日均 × 滞后天数，并按上周的消费结构摊到生存/弹性 */
  var estUnrecorded = hasHistory ? lastDaily * lagDays : 0;
  var shareL = (w1 > 0) ? (w1Living / w1) : 0.85;
  var shareF = (w1 > 0) ? (w1Flex / w1) : 0.15;
  var estLiving = estUnrecorded * shareL;
  var estFlex = estUnrecorded * shareF;

  var dLiving = Math.max(0, (pLeft.living - estLiving) / daysLeft);
  var dFlex = Math.max(0, (pLeft.flex - estFlex) / daysLeft);
  var dFixed = Math.max(0, pLeft.fixed / daysLeft);
  var dGrowth = Math.max(0, pLeft.growth / daysLeft);
  var todaySpend = dLiving + dFlex;

  var weekIdx = Math.floor((today - st.range.start) / d7) + 1;
  if (weekIdx < 1) weekIdx = 1;

  var projectedLeft = spendable - (st.total + lastDaily * daysLeft);

  return {
    daysLeft: daysLeft, weekIdx: weekIdx,
    dLiving: dLiving, dFlex: dFlex, dFixed: dFixed, dGrowth: dGrowth,
    todaySpend: todaySpend,
    lastDaily: lastDaily, lastLiving: w1Living / 7, lastFlex: w1Flex / 7, prevDaily: prevDaily,
    hasHistory: hasHistory, projectedLeft: projectedLeft,
    lagDays: lagDays, estUnrecorded: estUnrecorded
  };
}

/* 本周（周一起）每天的三餐花费，只看子类「吃饭」 */
function mealsWeek(){
  var now = new Date();
  var wd = (now.getDay() + 6) % 7;
  var start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - wd);
  var days = [];
  for (var i = 0; i < 7; i++){
    days.push({ date: new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), sum: 0, today: false });
  }
  for (var j = 0; j < state.tx.length; j++){
    var t = state.tx[j];
    if (t.pool === "outside" || t.sub !== "吃饭") continue;
    var d = parseTs(t.ts);
    if (!d) continue;
    var a = num(t.amount);
    for (var k = 0; k < 7; k++){
      if (sameDay(d, days[k].date)) days[k].sum += a;
    }
  }
  for (var m = 0; m < 7; m++) days[m].today = sameDay(days[m].date, now);
  return days;
}

  if (Math.abs(st.cash - total) > 0.5){
    h += '<div class="chip">本期现金支出<b>' + money0(st.cash) + '</b></div>';
  }
  h += '</div></div>';

  // 四池
  h += '<div class="grid2">';
  POOLS.forEach(function(p){
    var budget = budgetOf(p.id);
    var used = st.byPool[p.id] || 0;
    var pctUsed = budget > 0 ? Math.min(100, used / budget * 100) : (used > 0 ? 100 : 0);
    var over = budget > 0 && used > budget + 0.005;
    var noBudget = !(budget > 0) && used > 0;
    var left = budget - used;
    h += '<div class="card pool">';
    h += '<div class="row1"><div class="nm"><i style="background:' + p.hex + '"></i>' + p.name + '</div>';
    h += '<div class="amt"><b>' + money0(used) + '</b> / ' + money0(budget) + '</div></div>';
    h += '<div class="bar"><i style="width:' + pctUsed.toFixed(1) + '%;background:' + p.hex + '"></i></div>';
    h += '<div class="foot">' + (over
        ? '<span class="over">超出 ' + money0(-left) + '</span>'
        : (noBudget ? '这个池没分配预算，已花 ' + money0(used) : '还剩 ' + money0(left) + ' · ' + p.tip)) + '</div>';
    h += '</div>';
  });
  h += '</div>';

  // 本周节奏（生存盘与弹性盘都按周发）
  var anchor = today < st.range.start ? st.range.start
             : (today >= st.range.end ? new Date(st.range.end.getTime() - 86400000) : today);
  var wr = weekRange(anchor);
  if (wr.start < st.range.start) wr.start = new Date(st.range.start.getTime());
  if (wr.end > st.range.end) wr.end = new Date(st.range.end.getTime());
  var wrLast = new Date(wr.end.getTime() - 86400000);
  var daysInPeriod = Math.max(1, st.range.days);
  var weekLeftDays = Math.max(0, Math.round((wr.end - today) / 86400000));

  function weekRow(poolId, name, color){

    var wb = budget * 7 / daysInPeriod;

    st.txs.forEach(function(t){
      var d = parseTs(t.ts);
      if (d && d >= wr.start && d < wr.end && t.pool === poolId) used += num(t.amount);
    });
    var left = wb - used;
    var pu = wb > 0 ? Math.min(100, used / wb * 100) : 0;
    var s = '<div class="pool" style="margin-bottom:13px"><div class="row1">';
    s += '<div class="nm" style="font-size:13px">' + name + ' · 已用 ' + money0(used) + ' / 周额度 ' + money0(wb) + '</div>';
    s += '<div class="amt">' + (left >= 0 ? '剩 ' + money0(left) : '<span class="over">超 ' + money0(-left) + '</span>') + '</div></div>';
    s += '<div class="bar"><i style="width:' + pu.toFixed(1) + '%;background:' + (left < 0 ? "#cf4b45" : color) + '"></i></div></div>';
    return { html:s, pct:pu, left:left, used:used };

  else if (wFlex.pct >= 80) advice = "弹性盘用了 " + wFlex.pct.toFixed(0) + "%，接近上限，先别刷购物车。";
  else if (weekLeftDays <= 2) advice = "这周快过完了，生存盘还剩 " + money0(wLiving.left) + "，撑得住就撑到周一。";
  else advice = "节奏正常。生存盘日均可用 " + money0(wLiving.left / Math.max(1, weekLeftDays)) + "（本周还剩 " + weekLeftDays + " 天）。";

    h += '<div class="rows">';

    h += '</div>';

    h += '</div>';
  }

  // 订阅清单 · 与固定盘预算对比

    h += '<div class="card"><h3>订阅 · 折合每月 ' + money0(sm) + '</h3>';
    h += '<div class="hint">共 ' + state.subs.length + ' 项，一年约 ' + money0(subsYearly()) + '。';
    if (fixedBudget > 0 && sm > fixedBudget){
      h += '<br><span class="over">已经超过固定盘预算 ' + money0(fixedBudget) + '：要么调高固定盘，要么退订。</span>';
    } else if (fixedBudget > 0){

    } else {
      h += '<br><span class="over">固定盘现在是 0%：订阅会直接算成超支，建议给它留出 ' + money0(sm) + ' 以上。</span>';
    }
    /* 还在摊销期内的年付 */
    var amort = [];
    var pmi0 = monthIndex(st.range.start);
    state.tx.forEach(function(t){
      var sp = num(t.spread);
      if (sp > 1 && t.pool !== "outside"){
        var d0 = parseTs(t.ts);
        if (!d0) return;
        var covered = pmi0 - monthIndex(d0);
        if (covered >= 0 && covered < sp){
          amort.push({ note: t.note || t.sub, per: num(t.amount) / sp, left: sp - covered, word: spreadWord(sp) });
        }
      }
    });
    if (amort.length){
      h += '<div style="margin-top:8px">';
      amort.slice(0, 4).forEach(function(a2){
        h += '<div class="kv"><span>' + esc(a2.note) + '（' + a2.word + '摊销）</span><b>' + money0(a2.per) + '/月 · 还剩 ' + a2.left + ' 个月</b></div>';
      });
      h += '</div>';
    }
    h += '<div style="margin-top:8px"><button class="btn ghost sm" data-act="goSubs">管理订阅清单</button></div>';
    h += '</div>';
  }

  // 待定清单
  var pending = state.wish.filter(function(w){ return w.status === "pending"; });
  if (pending.length){
    h += '<div class="card"><h3>待定清单 · 想买但先放一放</h3><div class="rows">';
    pending.forEach(function(w){
      var created = w.createdAt;
      var due = created + num(s.coolDays, 2) * 24 * 3600 * 1000;
      var leftH = Math.max(0, Math.round((due - Date.now()) / 3600000));
      h += '<div class="wish"><div class="in"><b>' + money0(w.amount) + ' · ' + esc(w.note || "没写什么") + '</b>';
      h += '<small>' + (leftH > 0 ? "还有 " + leftH + " 小时到决定时间" : "已经到期，现在决定") + '</small></div>';
      h += '<div class="act"><button class="btn sm" data-act="wishBuy" data-id="' + w.id + '">买了</button>';
      h += '<button class="btn sm ghost" data-act="wishDrop" data-id="' + w.id + '">不买</button></div></div>';
    });
    h += '</div></div>';
  }

  // 这些数怎么来的
  var tops = Object.keys(st.bySub).map(function(k){ return { k:k, v:st.bySub[k] }; })
              .sort(function(a, b){ return b.v - a.v; });
  var topText = "还没有记录";
  if (tops.length && total > 0){
    var t0 = tops[0];
    var t0sub = String(t0.k).split("|")[1] || String(t0.k);
    topText = "「" + t0sub + "」" + money0(t0.v) + " · 占 " + (t0.v / total * 100).toFixed(0) + "%";
  }
  var fixedLeft = Math.max(0, budgetOf("fixed") - (st.byPool.fixed || 0));
  var growthLeft = Math.max(0, budgetOf("growth") - (st.byPool.growth || 0));

  h += '<div class="card" style="background:#fbfdfb;border-color:#dbe7df">';
  h += '<h3>这些数怎么来的</h3>';
  h += '<div class="kv"><span>最大头</span><b>' + topText + '</b></div>';
  h += '<div class="kv"><span>今天可花</span><b>' + money0(plan.todaySpend) + '（生存 ' + money0(plan.dLiving) + ' + 弹性 ' + money0(plan.dFlex) + '）</b></div>';
  h += '<div class="kv"><span>固定 / 成长</span><b>还有 ' + money0(fixedLeft) + ' / ' + money0(growthLeft) + '，按需花不摊到天</b></div>';
  if (!plan.hasHistory){
    h += '<div class="kv"><span>本周</span><b>第 ' + plan.weekIdx + ' 周，先按平均值</b></div>';
    h += '<div class="hint" style="margin-top:8px">还没有上周数据。下周起会按你的实际消费修正这个日额。</div>';
  } else {
    var cmp = "";
    if (plan.prevDaily > 0.5){
      var dp = (plan.lastDaily - plan.prevDaily) / plan.prevDaily * 100;
      cmp = "，" + (dp >= 0 ? "比前一周多 " : "比前一周少 ") + Math.abs(dp).toFixed(0) + "%";
    }
    h += '<div class="kv"><span>上周日均</span><b>' + money0(plan.lastDaily) + '（生存 ' + money0(plan.lastLiving) + ' / 弹性 ' + money0(plan.lastFlex) + '）' + cmp + '</b></div>';
    h += '<div class="kv"><span>按这速度，月底</span><b>' + (plan.projectedLeft >= 0 ? "还剩 " + money0(plan.projectedLeft) : "超支 " + money0(-plan.projectedLeft)) + '</b></div>';
  }
  if (plan.lagDays > 0 && plan.estUnrecorded > 1){
    h += '<div class="hint" style="margin-top:8px">已有 ' + plan.lagDays + ' 天没导入，按上周日均估还有约 '
       + money0(plan.estUnrecorded) + ' 花掉了但没记进来，日额里已经先扣掉。</div>';
  }
  h += '</div>';

  var pend = pendingFixes();
  if (pend.length){
    h += '<div class="note" style="display:flex;align-items:center;gap:10px;margin-top:10px">';
    h += '<span style="flex:1">有 <b>' + pend.length + '</b> 个词条你改过不止一次，多半是自动分类一直认错。</span>';
    h += '<button class="btn sm" data-act="goFixes">去整理</button></div>';
  }

  // 最近记录
  h += '<div class="card" style="margin-top:12px"><h3>最近记录</h3><div class="rows">';
  if (!st.txs.length){
    h += '<div class="empty">这里空着。用「记一笔」或「导账单」开始。</div>';
  } else {
    st.txs.slice(0, 6).forEach(function(t){ h += txRowHtml(t, false); });
  }
  h += '</div></div>';

  // 本周三餐
  var meals = mealsWeek();
  var mealTotal = 0, mealMax = 1;
  meals.forEach(function(m){ mealTotal += m.sum; if (m.sum > mealMax) mealMax = m.sum; });
  var dayNames = ["一", "二", "三", "四", "五", "六", "日"];
  h += '<div class="card"><h3>本周一日三餐 · ' + money0(mealTotal) + '</h3>';
  h += '<div class="chart">';
  meals.forEach(function(m, i){
    var pct = m.sum > 0 ? Math.max(4, m.sum / mealMax * 100) : 0;
    h += '<div class="col">';
    h += '<div class="v">' + (m.sum > 0 ? money0(m.sum) : "·") + '</div>';
    h += '<div class="barwrap"><i class="' + (m.today ? "today" : "") + '" style="height:' + pct.toFixed(1) + '%"></i></div>';
    h += '<div class="d">' + dayNames[i] + '</div>';
    h += '</div>';
  });
  h += '</div>';
  h += '<div class="hint" style="margin-top:10px">只统计子类「吃饭」。矿泉水和零食记到「零食」，就不会混进这张图。</div>';
  h += '</div>';

  document.getElementById("v-dash").innerHTML = h;
}

function txRowHtml(t, withDelete, hideDate){
  var d = parseTs(t.ts);

  var h = '<div class="tr tap" data-act="editTx" data-id="' + t.id + '">';
  if (!hideDate) h += '<div class="t">' + (d ? (d.getMonth() + 1) + "/" + d.getDate() : "—") + '</div>';
  h += '<div class="d">' + esc(t.note || t.party || p.name) + '</div>';
  h += '<div class="p" style="background:' + p.hex + '1f;color:' + p.hex + '">' + esc(t.sub || p.name) + '</div>';

  h += '</div>';
  return h;

/* ============================ 粘贴识别 ============================ */

var pendingTradeNo = "", pendingParty = "", pendingHM = null;

/* 不同 OCR 会把负号认成 − — – ﹣ 甚至汉字「一」，全角数字也常见，先统一 */
function normalizeReceiptText(text){
  var s = String(text || "");
  s = s.replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
  s = s.replace(/．/g, ".").replace(/：/g, ":");
  s = s.replace(/(^|[\s，,])[-−—–﹣－ー一]\s*(\d)/gm, "$1-$2");
  return s;
}

function parseReceipt(raw){
  var text = normalizeReceiptText(raw).replace(/\r/g, "");
  if (!text.replace(/\s/g, "")) return null;
  var out = { amount:0, date:null, merchant:"", product:"", payMethod:"", tradeNo:"" };

  var m = text.match(/(?:付款金额|实付金额|实付款|支付金额|订单金额|合计|金额)[：:\s]*[¥￥]?\s*(-?\d[\d,]*(?:\.\d{1,2})?)/);
  if (!m) m = text.match(/^[ \t]*-[ \t]*(\d[\d,]*\.\d{2})[ \t]*$/m);
  if (!m) m = text.match(/[¥￥]\s*(-?\d[\d,]*(?:\.\d{1,2})?)/);
  if (!m) m = text.match(/(?:已支付|支付成功|付款成功|成功支付)[^\d]{0,8}(\d{1,6}\.\d{2})(?!\d)/);
  if (!m) m = text.match(/^[ \t]*(\d{1,6}\.\d{2})[ \t]*$/m);
  if (m) out.amount = Math.abs(num(String(m[1]).replace(/,/g, ""), 0));

  var t = text.match(/(\d{4})\s*[年\-\/\.]\s*(\d{1,2})\s*[月\-\/\.]\s*(\d{1,2})\s*日?[^\d]{0,8}(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?/);
  if (!t) t = text.match(/(\d{4})\s*[年\-\/\.]\s*(\d{1,2})\s*[月\-\/\.]\s*(\d{1,2})\s*日?/);
  if (t) out.date = { y:+t[1], mo:+t[2], d:+t[3], h:+(t[4] || 0), mi:+(t[5] || 0) };

  var no = text.match(/(?:交易单号|交易号|订单编号|订单号|流水号)[：:\s]*([A-Za-z0-9]{10,40})/);
  if (!no) no = text.match(/^[ \t]*(\d{18,34})[ \t]*$/m);
  if (no) out.tradeNo = no[1];

  var sh = text.match(/(?:商户全称|商户名称|收款方|收款商户|付款给|商家名称)[：:\s]*([^\n]{2,50})/);
  if (sh) out.merchant = sh[1].trim();
  var pr = text.match(/(?:商品说明|商品名称|商品|订单内容|消费项目)[：:\s]*([^\n]{1,60})/);
  if (pr) out.product = pr[1].trim();
  var pay = text.match(/(?:支付方式|付款方式|扣款方式)[：:\s]*([^\n]{1,40})/);
  if (pay) out.payMethod = pay[1].trim();

  /* 没有「商户全称」这种标签时，凭证第一行通常就是收款方 */
  if (!out.merchant){
    var lines = text.split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
    for (var i = 0; i < lines.length; i++){
      var l = lines[i];
      if (/^-?\d/.test(l)) continue;
      if (/^\d{4}[年\-\/]/.test(l)) continue;
      if (/^[\d\s.,:¥￥]+$/.test(l)) continue;
      if (/支付|交易|状态|商品|商户|单号|金额|方式|机构/.test(l)) continue;
      out.merchant = l.slice(0, 30);
      break;
    }
  }
  if (!out.merchant && out.product) out.merchant = out.product;
  return out;
}

function setPasteHint(msg, kind){
  var el = document.getElementById("pasteHint");
  if (!el) return;
  el.textContent = msg || "";
  el.className = "hint " + (kind === "ok" ? "okText" : (kind === "err" ? "errText" : ""));
}

function syncEntryChips(){
  [].slice.call(document.querySelectorAll("#ePools .chip-btn")).forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-pool") === entryPool);
  });
  renderSubChips();
  renderEntryHint();
}

function alreadyRecorded(tradeNo){
  if (!tradeNo) return false;
  var h = "no|" + tradeNo;
  return state.tx.some(function(t){ return t.hash === h; });
}

function handlePasteText(text){
  var r = parseReceipt(text);
  if (!r || !(r.amount > 0)){
    setPasteHint("没认出金额。可以再粘一次，或者直接手填下面几项。", "err");
    return;
  }
  var amtEl = document.getElementById("eAmount");
  if (amtEl) amtEl.value = r.amount.toFixed(2);
  var noteEl = document.getElementById("eNote");
  if (noteEl && (r.product || r.merchant)) noteEl.value = r.product || r.merchant;
  var dateEl = document.getElementById("eDate");
  if (dateEl && r.date) dateEl.value = r.date.y + "-" + pad2(r.date.mo) + "-" + pad2(r.date.d);

  pendingParty = r.merchant || r.product || "";
  pendingTradeNo = r.tradeNo || "";
  pendingHM = r.date ? { h:r.date.h, mi:r.date.mi } : null;

  var cat = classify((r.merchant || "") + " " + (r.product || ""));
  entryPool = cat.pool;
  entrySub = cat.sub;
  syncEntryChips();

  var bits = [money(r.amount)];
  if (r.date) bits.push(r.date.mo + "/" + r.date.d + " " + pad2(r.date.h) + ":" + pad2(r.date.mi));
  if (pendingParty) bits.push(pendingParty);
  if (r.tradeNo) bits.push("单号尾 " + r.tradeNo.slice(-6));

  if (alreadyRecorded(r.tradeNo)){
    setPasteHint("这笔已经记过了（交易单号相同）：" + bits.join(" · "), "err");
  } else {
    setPasteHint("已识别：" + bits.join(" · ") + "。确认后点下面的「记下这笔」就行。", "ok");
  }
}

function pasteFromClipboard(){
  if (!navigator.clipboard || !navigator.clipboard.readText){
    toast("这个浏览器不让直接读剪贴板，长按输入框粘贴即可");
    return;
  }
  navigator.clipboard.readText().then(function(t){
    if (!t){ toast("剪贴板是空的"); return; }
    var pb = document.getElementById("pasteBox");
    if (pb) pb.value = t;
    handlePasteText(t);
  }).catch(function(){
    toast("读剪贴板被拒绝了，长按输入框粘贴即可");
  });
}

  h += '<textarea class="txt" id="pasteBox" placeholder="在这里长按粘贴，或点下面的按钮读剪贴板"></textarea>';

/* ============================ 账单解析 ============================ */

function decodeBytes(bytes){
  var u8 = (bytes instanceof Uint8Array) ? bytes : new Uint8Array(bytes);
  var txt = "";
  try { txt = new TextDecoder("utf-8").decode(u8); } catch(e){ txt = ""; }
  var bad = (txt.match(/\uFFFD/g) || []).length;
  if (bad > 0 || !txt){
    try {
      var g = new TextDecoder("gbk").decode(u8);
      if (g && (g.match(/\uFFFD/g) || []).length < bad) return g;
      return g || txt;
    } catch(e2){ return txt; }
  }
  return txt;
}

function parseCSV(text){
  var rows = [], row = [], field = "", inQ = false;
  var t = String(text || "").replace(/^\uFEFF/, "");
  for (var i = 0; i < t.length; i++){
    var c = t.charAt(i);
    if (inQ){
      if (c === '"'){
        if (t.charAt(i + 1) === '"'){ field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ","){ row.push(field); field = ""; }
      else if (c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r"){ /* 忽略 */ }
      else field += c;
    }
  }
  row.push(field);
  rows.push(row);
  return rows.filter(function(r){
    return r.some(function(v){ return String(v).trim() !== ""; });
  });
}

function findHeader(rows){
  var lim = Math.min(rows.length, 50);
  for (var i = 0; i < lim; i++){
    var r = rows[i].map(function(s){ return String(s).trim(); });
    var hasTime = r.indexOf("交易时间") >= 0 || r.indexOf("交易日期") >= 0;
    var hasAmt = r.some(function(s){ return s.indexOf("金额") >= 0; });
    var hasDir = r.some(function(s){ return s.indexOf("收/支") >= 0; });
    if (hasTime && (hasAmt || hasDir)) return i;
  }
  return -1;
}

function colOf(head, names){
  for (var i = 0; i < names.length; i++){
    for (var j = 0; j < head.length; j++){
      if (head[j].indexOf(names[i]) >= 0) return j;
    }
  }
  return -1;
}

function parseAmount(v){
  var s = String(v == null ? "" : v).replace(/[¥￥,\s元]/g, "").replace(/^\+/, "");
  var n = parseFloat(s);
  return isFinite(n) ? Math.abs(n) : 0;
}

function rowsToRecords(rows){
  var hi = findHeader(rows);
  if (hi < 0) return { records: [], error: "没找到「交易时间 / 金额」表头，可能不是支付宝或微信导出的账单" };

  var head = rows[hi].map(function(s){ return String(s).trim(); });
  var cTime = colOf(head, ["交易时间", "交易日期"]);
  var cAmt = colOf(head, ["金额"]);
  var cParty = colOf(head, ["交易对方", "对方", "商户名称", "商户"]);
  var cDesc = colOf(head, ["商品说明", "商品名称", "商品", "摘要", "备注"]);
  var cDir = colOf(head, ["收/支", "收支"]);
  var cStatus = colOf(head, ["交易状态", "当前状态", "状态"]);
  if (cTime < 0 || cAmt < 0) return { records: [], error: "表头里没认出「时间」或「金额」列" };

  var out = [];
  for (var i = hi + 1; i < rows.length; i++){
    var r = rows[i];

    if (!t) t = serialToDate(r[cTime]);
    if (!t) continue;
    var dir = cDir >= 0 ? String(r[cDir] || "").trim() : "";
    if (dir && dir !== "支出") continue;
    var stt = cStatus >= 0 ? String(r[cStatus] || "").trim() : "";
    if (/退款|关闭|失败|撤销|未支付|已全额/.test(stt)) continue;
    var amt = parseAmount(r[cAmt]);
    if (!(amt > 0)) continue;

    var party = cParty >= 0 ? String(r[cParty] || "").trim() : "";
    var desc = cDesc >= 0 ? String(r[cDesc] || "").trim() : "";
    var cls = classify(party + " " + desc);
    var ts = tsString(t);
    out.push({
      ts: ts, amount: amt, party: party, desc: desc,
      note: (desc || party || "支出"),
      pool: cls.pool, sub: cls.sub,
      auto: { pool: cls.pool, sub: cls.sub },
      hash: txHash(ts, amt, party), dup: false
    });
  }
  return { records: out, error: null };
}

/* ---------- zip ---------- */

function readZip(u8){
  var dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  var eocd = -1;
  var minPos = Math.max(0, u8.length - 65557);
  for (var i = u8.length - 22; i >= minPos; i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error("不是有效的 zip 文件");

  var count = dv.getUint16(eocd + 10, true);
  var cdOff = dv.getUint32(eocd + 16, true);
  var out = [], p = cdOff;
  for (var k = 0; k < count; k++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    var flags = dv.getUint16(p + 8, true);
    var method = dv.getUint16(p + 10, true);
    var csize = dv.getUint32(p + 20, true);
    var nlen = dv.getUint16(p + 28, true);
    var elen = dv.getUint16(p + 30, true);
    var clen = dv.getUint16(p + 32, true);
    var lho = dv.getUint32(p + 42, true);

    var nameBytes = u8.subarray(p + 46, p + 46 + nlen);
    var name = "";
    try { name = new TextDecoder("utf-8").decode(nameBytes); } catch(e){ name = ""; }
    if (!name || /\uFFFD/.test(name)){
      try { name = new TextDecoder("gbk").decode(nameBytes); } catch(e2){}
    }
    var dataStart = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    out.push({ name: name, method: method, flags: flags, data: u8.subarray(dataStart, dataStart + csize) });
    p = p + 46 + nlen + elen + clen;
  }
  return out;
}

async function inflateRaw(bytes){
  if (typeof DecompressionStream === "undefined"){
    throw new Error("这个浏览器不支持自动解压，请先手动解压成 csv");
  }
  var ds = new DecompressionStream("deflate-raw");
  var stream = new Blob([bytes]).stream().pipeThrough(ds);
  var buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}

/* ---------- xlsx ---------- */

function xmlUnescape(s){
  return String(s == null ? "" : s)
    .replace(/&#x([0-9a-fA-F]+);/g, function(_, h){ return String.fromCharCode(parseInt(h, 16)); })
    .replace(/&#(\d+);/g, function(_, d2){ return String.fromCharCode(parseInt(d2, 10)); })
    .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
    .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&amp;/g, "&");
}

function colIndex(ref){
  var m = /^([A-Z]+)/.exec(String(ref || "").toUpperCase());
  if (!m) return -1;
  var s = m[1], n = 0;
  for (var i = 0; i < s.length; i++) n = n * 26 + (s.charCodeAt(i) - 64);
  return n - 1;
}

/* Excel 的日期是「从 1899-12-30 起的天数」，转回本地时间 */
function serialToDate(v){
  var n = parseFloat(String(v == null ? "" : v).trim());
  if (!(n > 20000 && n < 80000)) return null;
  var ms = Math.round((n - 25569) * 86400000);
  var probe = new Date(ms);
  return new Date(ms + probe.getTimezoneOffset() * 60000);
}

function parseSharedStrings(xml){
  var out = [], re = /<si[^>]*>([\s\S]*?)<\/si>/g, m;
  while ((m = re.exec(xml))){
    var inner = m[1], s = "", t, tre = /<t[^>]*>([\s\S]*?)<\/t>/g;
    while ((t = tre.exec(inner))) s += xmlUnescape(t[1]);
    out.push(s);
  }
  return out;
}

function parseSheetXml(xml, shared){
  var rows = [], rre = /<row[^>]*>([\s\S]*?)<\/row>/g, rm;
  while ((rm = rre.exec(xml))){
    var cells = [], n = 0;
    var cre = /<c([^>]*?)(\/>|>([\s\S]*?)<\/c>)/g, cm;
    while ((cm = cre.exec(rm[1]))){
      var attrs = cm[1] || "";
      var body = cm[3] || "";
      var ref = (attrs.match(/r="([A-Z]+)\d+"/) || [])[1];
      var type = (attrs.match(/t="([^"]+)"/) || [])[1];
      var val = "";
      if (type === "s"){
        var v = (body.match(/<v>([\s\S]*?)<\/v>/) || [])[1];
        val = v != null ? (shared[parseInt(v, 10)] || "") : "";
      } else if (type === "inlineStr"){
        var it = body.match(/<t[^>]*>([\s\S]*?)<\/t>/);
        val = it ? xmlUnescape(it[1]) : "";
      } else {
        var v2 = body.match(/<v>([\s\S]*?)<\/v>/);
        val = v2 ? xmlUnescape(v2[1]) : "";
      }
      var idx = ref ? colIndex(ref) : n;
      if (idx < 0) idx = n;
      cells[idx] = val;
      n = idx + 1;
    }
    for (var k = 0; k < cells.length; k++) if (cells[k] === undefined) cells[k] = "";
    rows.push(cells);
  }
  return rows;
}

/* 把 xlsx 的每个工作表解成二维数组 */
async function xlsxToSheets(entries){
  var files = {};
  for (var i = 0; i < entries.length; i++){
    var e2 = entries[i];
    if (e2.flags & 0x1) continue;
    var d2 = e2.data;
    if (e2.method === 8){ try { d2 = await inflateRaw(d2); } catch(err){ continue; } }
    else if (e2.method !== 0) continue;
    files[e2.name] = d2;
  }
  var shared = files["xl/sharedStrings.xml"] ? parseSharedStrings(decodeBytes(files["xl/sharedStrings.xml"])) : [];
  var names = Object.keys(files)
    .filter(function(n){ return /^xl\/worksheets\/sheet\d+\.xml$/i.test(n); })
    .sort(function(a, b){ return a.localeCompare(b, undefined, { numeric: true }); });

  var out = [];
  for (var j = 0; j < names.length; j++){
    out.push(parseSheetXml(decodeBytes(files[names[j]]), shared));
  }
  return out;
}

async function handleFiles(files){
  var list = Array.prototype.slice.call(files || []);
  if (!list.length) return;
  var recs = [], notes = [];

  for (var i = 0; i < list.length; i++){
    var f = list[i];
    try {
      var u8 = new Uint8Array(await f.arrayBuffer());
      var parts = [];
      if (u8.length > 4 && u8[0] === 0x50 && u8[1] === 0x4b){
        var entries = readZip(u8);
        var isXlsx = false;
        for (var xi = 0; xi < entries.length; xi++){
          if (/^xl\/workbook\.xml$/i.test(entries[xi].name)) { isXlsx = true; break; }
        }

        if (isXlsx){
          var sheets = await xlsxToSheets(entries);
          var got = 0;
          for (var si = 0; si < sheets.length; si++){
            var xr = rowsToRecords(sheets[si]);
            if (xr.error || !xr.records.length) continue;
            for (var ri = 0; ri < xr.records.length; ri++){
              xr.records[ri].source = "bill";
              recs.push(xr.records[ri]);
            }
            got += xr.records.length;
            notes.push(f.name + " 第 " + (si + 1) + " 个表：解析出 " + xr.records.length + " 笔");
          }
          if (!got) notes.push(f.name + "：xlsx 里没找到「交易时间 / 金额」表头");
        } else {
          for (var j = 0; j < entries.length; j++){
            var e = entries[j];
            if (!/\.csv$/i.test(e.name)) continue;
            if (e.flags & 0x1){ notes.push(e.name + "：压缩包加密了，请先解压"); continue; }
            var data = e.data;
            if (e.method === 8) data = await inflateRaw(data);
            else if (e.method !== 0){ notes.push(e.name + "：不支持的压缩方式"); continue; }
            parts.push({ name: e.name, text: decodeBytes(data) });
          }
          if (!parts.length && !notes.length) notes.push(f.name + "：zip 里没有 csv");
        }
      } else {
        parts.push({ name: f.name, text: decodeBytes(u8) });
      }
      for (var q = 0; q < parts.length; q++){
        var res = rowsToRecords(parseCSV(parts[q].text));
        if (res.error){ notes.push(parts[q].name + "：" + res.error); continue; }
        res.records.forEach(function(r){ r.source = "bill"; recs.push(r); });
        notes.push(parts[q].name + "：解析出 " + res.records.length + " 笔");
      }
    } catch(err){
      notes.push(f.name + " 读取失败：" + (err && err.message ? err.message : String(err)));
    }
  }

  if (!recs.length){
    importRows = [];
    renderImport(notes);
    toast(notes.length ? notes[0] : "没读到数据");
    return;
  }

  var seen = {};
  state.tx.forEach(function(t){ if (t.hash) seen[t.hash] = 1; });
  recs.forEach(function(r){
    if (seen[r.hash]) r.dup = true;
    else seen[r.hash] = 1;
  });
  recs.sort(function(a, b){ return a.ts < b.ts ? 1 : -1; });
  importRows = recs;
  renderImport(notes);
  toast("解析出 " + recs.length + " 笔，确认后导入");
}

function poolOptions(sel){
  var h = "";
  ALL_POOLS.forEach(function(p){
    var label = p.id === "outside" ? "应急（不计入）" : p.name;
    h += '<option value="' + p.id + '"' + (p.id === sel ? " selected" : "") + '>' + label + '</option>';
  });
  return h;
}
function subOptions(pool, sel){
  var arr = SUBS[pool] || ["其他"];
  var h = "";
  arr.forEach(function(s){
    h += '<option value="' + s + '"' + (s === sel ? " selected" : "") + '>' + s + '</option>';
  });
  return h;
}

function bindImport(){
  var dz = document.getElementById("dropZone");
  var fi = document.getElementById("fileInput");
  if (!dz || !fi) return;
  dz.addEventListener("click", function(){ fi.click(); });
  fi.addEventListener("change", function(e){ handleFiles(e.target.files); e.target.value = ""; });
  ["dragenter", "dragover"].forEach(function(ev){
    dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add("hot"); });
  });
  ["dragleave", "drop"].forEach(function(ev){
    dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove("hot"); });
  });
  dz.addEventListener("drop", function(e){
    if (e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
  });
  var table = document.querySelector("#v-import table");
  if (table){
    table.addEventListener("change", function(e){
      var sel = e.target;
      if (sel.tagName !== "SELECT") return;
      var idx = parseInt(sel.getAttribute("data-i"), 10);
      var f = sel.getAttribute("data-f");
      var r = importRows[idx];
      if (!r) return;
      if (f === "pool"){
        r.pool = sel.value;
        r.sub = (SUBS[r.pool] || ["其他"])[0];
        var subSel = sel.parentNode.parentNode.querySelector('select[data-f="sub"]');
        if (subSel) subSel.innerHTML = subOptions(r.pool, r.sub);
      } else {
        r.sub = sel.value;
      }
    });
  }
}

function confirmImport(){
  var rows = importRows.filter(function(r){ return !r.dup; });
  if (!rows.length){ toast("没有可导入的新记录"); return; }
  rows.forEach(function(r){
    if (r.auto && (r.pool !== r.auto.pool || r.sub !== r.auto.sub)){
      recordFix(r.party || r.note, r.pool, r.sub);
    }
    state.tx.push({
      id: uid(), ts: r.ts, amount: r.amount, pool: r.pool, sub: r.sub,
      note: r.note, party: r.party, source: "bill", hash: r.hash
    });
  });
  saveState();
  var n = rows.length;
  importRows = [];
  renderDash();
  showTab("dash");
  toast("已导入 " + n + " 笔");
}

var ALLOC_COLORS = { fixed:"#7b8b9a", living:"#2f9e6e", growth:"#3d7bd9", flex:"#d98324", save:"#1f2b25" };

function readAlloc(){
  var s = state.settings;
  function v(id, fb){
    var el = document.getElementById(id);
    if (!el) return num(fb);
    var raw = String(el.value == null ? "" : el.value).trim();
    return raw === "" ? num(fb) : num(raw);
  }
  var income = v("sIncome", s.income);
  var items = [
    { id:"fixed",  name:"固定盘", color:ALLOC_COLORS.fixed,  pct:v("s-fixed", s.pct.fixed) },
    { id:"living", name:"生存盘", color:ALLOC_COLORS.living, pct:v("s-living", s.pct.living) },
    { id:"growth", name:"成长盘", color:ALLOC_COLORS.growth, pct:v("s-growth", s.pct.growth) },
    { id:"flex",   name:"弹性盘", color:ALLOC_COLORS.flex,   pct:v("s-flex", s.pct.flex) },
    { id:"save",   name:"储蓄盘", color:ALLOC_COLORS.save,   pct:v("s-save", s.saveRate) }
  ];
  var total = 0;
  items.forEach(function(it){ total += it.pct; it.amt = income * it.pct / 100; });
  return { items:items, total:total, income:income };
}

function pieCss(items){
  var total = 0;
  items.forEach(function(it){ if (it.pct > 0) total += it.pct; });
  if (!(total > 0)) return "#ecefe9";
  var acc = 0, stops = [];
  items.forEach(function(it){
    if (!(it.pct > 0)) return;
    var from = acc / total * 100;
    acc += it.pct;
    var to = acc / total * 100;
    stops.push(it.color + " " + from.toFixed(2) + "% " + to.toFixed(2) + "%");
  });
  return "conic-gradient(from -90deg," + stops.join(",") + ")";
}

function updateAlloc(){
  var a = readAlloc();
  var pie = document.getElementById("pctPie");
  if (!pie) return;
  pie.style.background = pieCss(a.items);

  var ok = Math.abs(a.total - 100) < 0.01;
  var tot = document.getElementById("pctTotal");
  if (tot){
    tot.textContent = ok ? "100%" : a.total.toFixed(0) + "%";
    tot.style.color = ok ? "" : "#cf4b45";
  }

  var lg = document.getElementById("pctLegend");
  if (lg){
    var lh = "";
    a.items.forEach(function(it){
      lh += '<div class="lg"><i style="background:' + it.color + '"></i><span>' + it.name + '</span>';
      lh += '<b>' + it.pct + '%</b><em>' + money0(it.amt) + '</em></div>';
    });
    lg.innerHTML = lh;
  }

  a.items.forEach(function(it){
    var hint = document.getElementById("hint-" + it.id);
    if (hint){
      hint.textContent = "≈ " + money0(it.amt) + " / 月" +
        (it.id === "fixed" && state.subs.length ? "，其中订阅 " + money0(subsMonthly()) : "");
    }
  });

  var stEl = document.getElementById("sTotal");
  if (stEl){
    stEl.textContent = "合计 " + a.total + "%（含储蓄），应为 100%";
    stEl.style.color = ok ? "#2f9e6e" : "#cf4b45";
  }
}

function readNum(id, def){
  var el = document.getElementById(id);
  if (!el) return num(def);
  var raw = String(el.value == null ? "" : el.value).replace(/[,\s¥￥]/g, "").trim();
  if (raw === "") return num(def);
  return num(raw, def);
}

function collectSettings(){
  var pct = {};
  POOLS.forEach(function(p){ pct[p.id] = readNum("s-" + p.id, state.settings.pct[p.id]); });
  var saveRate = readNum("s-save", state.settings.saveRate);
  return {
    income: readNum("sIncome", state.settings.income),
    startDay: Math.min(28, Math.max(1, Math.round(readNum("sStartDay", state.settings.startDay)))),
    pct: pct,
    saveRate: saveRate,
    total: pct.fixed + pct.living + pct.growth + pct.flex + saveRate,
    cool: readNum("sCool", state.settings.coolThreshold),
    coolHours: readNum("sCoolDays", Math.round(num(state.settings.coolDays, 2) * 24))
  };
}

function settingsStatus(msg, kind){
  var el = document.getElementById("saveState");
  if (!el) return;
  el.textContent = msg;
  el.className = "hint " + (kind === "ok" ? "okText" : (kind === "err" ? "errText" : ""));
}

/* 真的写进去了吗？写不进去时（存储被禁用）不能假装成功 */
function storedOk(income){
  try {
    var o = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    return !!(o && o.settings && Math.abs(num(o.settings.income) - income) < 0.001);
  } catch(e){ return false; }
}

function applySettings(opts){
  opts = opts || {};
  var c = collectSettings();

  if (!(c.income > 0)){
    settingsStatus("生活费要大于 0，没有保存", "err");
    if (!opts.silent) toast("生活费要大于 0");
    return false;
  }
  if (Math.abs(c.total - 100) > 0.01){
    settingsStatus("比例合计 " + c.total + "%（含储蓄），要正好 100%，没有保存", "err");
    if (!opts.silent) toast("比例合计是 " + c.total + "%，需要正好 100%");
    return false;
  }

  state.settings.income = c.income;
  state.settings.startDay = c.startDay;
  state.settings.pct = c.pct;
  state.settings.saveRate = c.saveRate;
  state.settings.coolThreshold = c.cool;
  state.settings.coolDays = Math.max(1, c.coolHours) / 24;
  saveState();

  if (!storedOk(c.income)){
    settingsStatus("没能写进本机存储，关掉页面就会丢。换回文件卡片打开试试。", "err");
    if (!opts.silent) toast("保存失败：本机存储被禁用");
    return false;
  }

  curPeriod = periodStartOf(new Date(), c.startDay);
  var rr = periodRange(curPeriod, c.startDay);
  var pl = document.getElementById("periodLabel");
  if (pl) pl.textContent = rr.label + " · " + rr.days + " 天";
  updateAlloc();

  var d = new Date();
  settingsStatus("已保存 · " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + "（更早的改动也一起存了）", "ok");
  if (!opts.silent) toast("已保存");
  return true;
}

function saveSettings(){ return applySettings({ silent:false }); }

function addSub(){
  var nameEl = document.getElementById("subName");
  var name = nameEl ? nameEl.value.trim() : "";
  var amt = readNum("subAmount", 0);
  if (!name){ toast("先写订阅名称"); return; }
  if (!(amt > 0)){ toast("金额要大于 0"); return; }
  var cycEl = document.getElementById("subCycle");
  var cyc = (cycEl && cycEl.value) ? cycEl.value : subCyclePick;
  var cycle = (cyc === "year" || cyc === "quarter") ? cyc : "month";
  var nextEl = document.getElementById("subNext");
  var next = nextEl ? nextEl.value : "";
  state.subs.push({ id: uid(), name: name, amount: amt, cycle: cycle, next: next });
  saveState();
  renderSettings();
  toast("已加入订阅清单，" + money0(amt) + (cycle === "year" ? " / 年" : cycle === "quarter" ? " / 季" : " / 月"));
}

function delSub(id){
  state.subs = state.subs.filter(function(s){ return s.id !== id; });
  saveState();
  renderSettings();
  renderDash();
  toast("已删除");
}

/* 比例不是 100% 时的一键配平：差额补进/减出储蓄盘，避免改生活费时被卡住 */
function balancePct(){
  var c = collectSettings();
  var diff = 100 - c.total;
  if (Math.abs(diff) < 0.01){ toast("已经是 100% 了"); return true; }
  var el = document.getElementById("s-save");
  if (!el) return false;
  var next = c.saveRate + diff;
  if (next < 0){ next = 0; }
  el.value = String(Math.round(next * 100) / 100);
  updateAlloc();
  return applySettings({});
}

function addRule(){
  var kw = document.getElementById("rKw").value.trim();
  if (!kw){ toast("先写个关键词"); return; }
  var pool = document.getElementById("rPool").value;
  var sub = document.getElementById("rSub").value;
  var dup = state.rules.some(function(r){ return r.kw === kw; });
  if (dup){ toast("这个关键词已经有了"); return; }
  state.rules.unshift({ id: uid(), kw: kw, pool: pool, sub: sub });
  saveState();
  renderSettings();
  toast("规则已添加");
}

/* ============================ 数据操作 ============================ */

function exportJson(){
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "消费架构备份-" + tsString(new Date()).slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
  toast("已导出备份文件");
}

function importJsonFile(file){
  var fr = new FileReader();
  fr.onload = function(){
    try {
      var o = JSON.parse(String(fr.result));
      if (!o || !Array.isArray(o.tx)) throw new Error("格式不对");
      if (!window.confirm("导入会覆盖当前 " + state.tx.length + " 笔数据，继续？")) return;
      state.settings = Object.assign(defaultSettings(), o.settings || {});
      state.settings.pct = Object.assign(defaultSettings().pct, (o.settings && o.settings.pct) || {});
      state.tx = o.tx || [];
      state.wish = o.wish || [];
      state.rules = o.rules || [];
      saveState();
      curPeriod = periodStartOf(new Date(), num(state.settings.startDay, 1));
      refresh();
      toast("已导入 " + state.tx.length + " 笔");
    } catch(e){
      toast("导入失败：不是有效的备份文件");
    }
  };
  fr.readAsText(file, "utf-8");
}

var TOUR_STEPS = [
  { sel:null, title:"先喂它一口数据", next:"看看怎么加",
    text:"空着的看板什么都说明不了。先放点真实消费进来，五池、分类、周节奏才有意义。" },
  { tab:"entry", sel:"#pasteBox", title:"手动记：3 秒一笔", next:"下一步",
    text:"金额 → 选池 → 回车。也可以把支付截图里提取的文字粘进这个框，金额、时间、商户会自动填好。" },
  { tab:"import", sel:"#dropZone", title:"批量导：一个月一次就够", next:"开始用",
    text:"支付宝/微信导出 ZIP、CSV 或 XLSX 拖进来，自动认表头、自动分类、按交易单号去重。导入后分类不对就点开改，改两次会进「改错排行」，一键全改。" }
];

var tourIdx = -1;

function tourEl(id){ return document.getElementById(id); }

function startTour(){
  tourIdx = 0;
  var t = tourEl("tour");
  if (!t) return;
  t.classList.add("on");
  lockScroll(true);
  renderTourStep();
}

function renderTourStep(){
  var st = TOUR_STEPS[tourIdx];
  if (!st){ endTour(); return; }
  if (st.tab) showTab(st.tab);

  var card = tourEl("tourCard");
  card.innerHTML =
    '<div class="tourStep">' + (tourIdx + 1) + " / " + TOUR_STEPS.length + '</div>' +
    '<div class="tourTitle">' + esc(st.title) + '</div>' +
    '<div class="tourText">' + esc(st.text) + '</div>' +
    '<div class="tourBtns">' +
      (tourIdx > 0
        ? '<button class="btn ghost sm" data-tour="prev">上一步</button>'
        : '<button class="btn ghost sm" data-tour="skip">跳过</button>') +
      '<button class="btn primary sm" data-tour="next">' + esc(st.next) + '</button>' +
    '</div>';

  setTimeout(function(){ placeTour(st); }, st.tab ? 70 : 0);
}

function placeTour(st){
  var spot = tourEl("tourSpot");
  var card = tourEl("tourCard");
  if (!spot || !card || !card.offsetWidth) return;

  var target = st.sel ? document.querySelector(st.sel) : null;
  var rect = null;
  var block = tourEl("tourBlock");

  if (target){
    target.scrollIntoView({ block: "center" });
    var r = target.getBoundingClientRect();
    var pad = 8;
    rect = { top:r.top - pad, left:r.left - pad, width:r.width + pad * 2, height:r.height + pad * 2 };
    spot.style.display = "block";
    spot.style.top = rect.top + "px";
    spot.style.left = rect.left + "px";
    spot.style.width = rect.width + "px";
    spot.style.height = rect.height + "px";
  } else {
    spot.style.display = "none";
  }
  /* 有聚光灯时用光圈的阴影压暗，否则整块遮罩压暗 */
  if (block) block.style.background = rect ? "transparent" : "rgba(12,18,15,.58)";

  var cw = card.offsetWidth, ch = card.offsetHeight;
  var top, left;
  if (rect){
    var below = window.innerHeight - (rect.top + rect.height);
    top = (below > ch + 20) ? rect.top + rect.height + 14 : Math.max(12, rect.top - ch - 14);
    left = rect.left + rect.width / 2 - cw / 2;
  } else {
    top = (window.innerHeight - ch) / 2;
    left = (window.innerWidth - cw) / 2;
  }
  left = Math.min(Math.max(12, left), window.innerWidth - cw - 12);
  top = Math.min(Math.max(12, top), window.innerHeight - ch - 12);
  card.style.top = top + "px";
  card.style.left = left + "px";
}

function tourNext(){
  tourIdx++;
  if (tourIdx >= TOUR_STEPS.length) endTour();
  else renderTourStep();
}

function tourPrev(){
  if (tourIdx > 0){ tourIdx--; renderTourStep(); }
}

function endTour(){
  tourIdx = -1;
  var t = tourEl("tour");
  if (t) t.classList.remove("on");
  lockScroll(false);
  if (!state.meta) state.meta = {};
  state.meta.tourDone = true;
  saveState();
}

/* ============================ 交互与启动 ============================ */

function showTab(name){
  activeTab = name;
  [].slice.call(document.querySelectorAll("#tabs button")).forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-tab") === name);
  });
  [].slice.call(document.querySelectorAll(".view")).forEach(function(v){
    v.classList.toggle("on", v.id === "v-" + name);
  });
  if (name === "dash") renderDash();
  else if (name === "entry") renderEntry();
  else if (name === "import") renderImport();
  else if (name === "list") renderList();
  else if (name === "settings") renderSettings();
  if (window.scrollY > 0) window.scrollTo({ top: 0, behavior: "smooth" });
}

function refresh(){
  var r = periodRange(curPeriod, num(state.settings.startDay, 1));
  document.getElementById("periodLabel").textContent = r.label + " · " + r.days + " 天";
  if (activeTab === "dash") renderDash();
  else if (activeTab === "list") renderList();
  else if (activeTab === "settings") renderSettings();
}

function shiftPeriod(delta){
  var d = new Date(curPeriod.getFullYear(), curPeriod.getMonth() + delta, 2);
  curPeriod = periodStartOf(d, num(state.settings.startDay, 1));
  refresh();
}

function bindGlobal(){
  ["dragover", "drop"].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, false);
  });

  window.addEventListener("resize", function(){
    if (tourIdx >= 0) placeTour(TOUR_STEPS[tourIdx]);
  });

  document.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest("[data-act],[data-tab],[data-pool],[data-sub],[data-filter],[data-epool],[data-esub],[data-tour],[data-cycle]") : null;
    if (!el) return;

    if (el.hasAttribute("data-tour")){
      var ta = el.getAttribute("data-tour");
      if (ta === "next") tourNext();
      else if (ta === "prev") tourPrev();
      else endTour();
      return;
    }

    if (el.hasAttribute("data-tab")){ showTab(el.getAttribute("data-tab")); return; }

    if (el.hasAttribute("data-filter")){
      listFilter = el.getAttribute("data-filter");
      renderList();
      return;
    }

    if (el.hasAttribute("data-pool") && el.parentNode && el.parentNode.id === "ePools"){
      entryPool = el.getAttribute("data-pool");
      [].slice.call(document.querySelectorAll("#ePools .chip-btn")).forEach(function(b){
        b.classList.toggle("on", b.getAttribute("data-pool") === entryPool);
      });
      renderSubChips();
      renderEntryHint();
      return;
    }

    if (el.hasAttribute("data-sub") && el.parentNode && el.parentNode.id === "eSubs"){
      entrySub = el.getAttribute("data-sub");
      [].slice.call(document.querySelectorAll("#eSubs .chip-btn")).forEach(function(b){
        b.classList.toggle("on", b.getAttribute("data-sub") === entrySub);
      });
      return;
    }

    if (el.hasAttribute("data-epool")){ pickEditPool(el.getAttribute("data-epool")); return; }
    if (el.hasAttribute("data-cycle")){
      subCyclePick = el.getAttribute("data-cycle");
      [].slice.call(document.querySelectorAll("#subCycleChips .chip-btn")).forEach(function(b){
        b.classList.toggle("on", b.getAttribute("data-cycle") === subCyclePick);
      });
      return;
    }
    if (el.hasAttribute("data-esub")){ pickEditSub(el.getAttribute("data-esub")); return; }

    var act = el.getAttribute("data-act");
    if (!act) return;

    if (act === "editTx"){ openEdit(el.getAttribute("data-id")); return; }
    if (act === "closeSheet"){ closeSheet(); return; }
    if (act === "saveEdit"){ saveEdit(); return; }
    if (act === "delEdit"){ delEdit(); return; }
    if (act === "ruleFromTx"){ ruleFromTx(); return; }

    if (act === "prevPeriod"){ shiftPeriod(-1); return; }
    if (act === "nextPeriod"){ shiftPeriod(1); return; }
    if (act === "todayPeriod"){
      curPeriod = periodStartOf(new Date(), num(state.settings.startDay, 1));
      refresh();
      return;
    }
    if (act === "goSettings"){ showTab("settings"); return; }
    if (act === "backup"){ exportJson(); return; }
    if (act === "saveEntry"){ saveEntry(); return; }
    if (act === "addWish"){ addWish(); return; }
    if (act === "pasteClip"){ pasteFromClipboard(); return; }
    if (act === "parsePaste"){
      var pbx = document.getElementById("pasteBox");
      if (pbx && pbx.value.trim()) handlePasteText(pbx.value);
      else toast("先把文字粘到框里");
      return;
    }
    if (act === "delTx"){
      var id = el.getAttribute("data-id");
      state.tx = state.tx.filter(function(t){ return t.id !== id; });
      saveState();
      if (activeTab === "list") renderList();
      renderDash();
      toast("已删除");
      return;
    }
    if (act === "wishBuy"){
      var wid = el.getAttribute("data-id");
      var w = null;
      state.wish.forEach(function(x){ if (x.id === wid) w = x; });
      if (!w) return;
      w.status = "bought";
      state.tx.push({
        id: uid(), ts: tsString(new Date()), amount: num(w.amount), pool: w.pool || "flex",
        sub: (SUBS[w.pool || "flex"] || ["其他"])[0], note: w.note || "待定后购入",
        party: w.note || "", source: "wish", hash: null
      });
      saveState();
      renderDash();
      if (activeTab === "list") renderList();
      toast("已记为支出");
      return;
    }
    if (act === "wishDrop"){
      var wid2 = el.getAttribute("data-id");
      state.wish.forEach(function(x){ if (x.id === wid2) x.status = "dropped"; });
      saveState();
      renderDash();
      toast("省下一笔");
      return;
    }
    if (act === "confirmImport"){ confirmImport(); return; }
    if (act === "clearImport"){ importRows = []; renderImport(); return; }
    if (act === "saveSettings"){ saveSettings(); return; }
    if (act === "balancePct"){ balancePct(); return; }
    if (act === "addSub"){ addSub(); return; }
    if (act === "delSub"){ delSub(el.getAttribute("data-id")); return; }
    if (act === "goSubs"){ showTab("settings"); return; }
    if (act === "applyFix"){
      if (applyFix(el.getAttribute("data-kw"))){
        renderSettings();
        renderDash();
      }
      return;
    }
    if (act === "applyAllFixes"){
      applyAllFixes();
      renderSettings();
      renderDash();
      return;
    }
    if (act === "goFixes"){ showTab("settings"); return; }
    if (act === "addRule"){ addRule(); return; }
    if (act === "delRule"){
      var rid = el.getAttribute("data-id");
      state.rules = state.rules.filter(function(r){ return r.id !== rid; });
      saveState();
      renderSettings();
      toast("规则已删除");
      return;
    }
    if (act === "exportJson"){ exportJson(); return; }
    if (act === "importJsonBtn"){
      var ji = document.getElementById("jsonInput");
      if (ji) ji.click();
      return;
    }
    if (act === "loadSample"){ loadSample(); return; }
    if (act === "clearAll"){ clearAll(); return; }
    if (act === "replayTour"){ startTour(); return; }
  });

  document.addEventListener("change", function(e){
    if (e.target && e.target.id === "jsonInput" && e.target.files && e.target.files[0]){
      importJsonFile(e.target.files[0]);
      e.target.value = "";
    }
  });
}

function storageOk(){
  try {
    localStorage.setItem("__sa_test__", "1");
    localStorage.removeItem("__sa_test__");
    return true;
  } catch(e){ return false; }
}

function init(){
  var sd = num(state.settings.startDay, 1);
  curPeriod = periodStartOf(new Date(), sd);
  entryPool = "living"; entrySub = (SUBS.living || ["其他"])[0];
  bindGlobal();
  showTab("dash");
  refresh();

  if (!state.meta) state.meta = {};
  if (!state.meta.tourDone && !state.tx.length && !state.wish.length){
    setTimeout(function(){ startTour(); }, 450);
  }

  if (!storageOk()){
    setTimeout(function(){
      toast("浏览器禁用了本地存储，记录无法保存；请换用 Chrome/Edge 打开，或把文件放到本地磁盘再从浏览器打开");
    }, 600);
  }
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
<script>
/* PWA：只有 https / localhost 才能注册 Service Worker；file:// 双击打开时自动跳过 */
(function(){
  if (!("serviceWorker" in navigator)) return;
  var secure = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if (!secure) return;
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* 离线能力不可用时不影响主功能 */ });
  });
})();
</script>
